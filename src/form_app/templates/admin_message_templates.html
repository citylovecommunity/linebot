{% extends "base.html" %}

{% block title %}訊息文案管理{% endblock %}

{% block content %}
<div class="container-fluid mt-4" style="max-width: 900px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">訊息文案管理</h2>
    <a href="{{ url_for('admin_bp.admin_dashboard') }}" class="btn btn-sm btn-outline-secondary">← 返回後台</a>
  </div>
  <p class="text-muted small">
    編輯系統自動發送的 LINE 訊息文案，儲存後立即套用到下一次發送。
    文案中的 <code>{{ '{url}' }}</code> 會自動替換為對應的連結。
  </p>

  <form id="message-templates-form" method="POST" action="{{ url_for('admin_bp.message_templates') }}">
    {% for t in templates %}
    <div class="card mb-3">
      <div class="card-body">
        <h6 class="card-title mb-1">{{ t.label }}</h6>
        <p class="text-muted small mb-2">{{ t.description }}</p>
        <textarea class="form-control" name="{{ t.key }}" rows="6" required>{{ t.content }}</textarea>
      </div>
    </div>
    {% endfor %}

    <button type="submit" class="btn btn-danger" id="save-templates-btn">
      <i class="bi bi-save"></i> 儲存文案
    </button>
  </form>
</div>

<script>
  document.getElementById('message-templates-form').addEventListener('submit', function() {
    const btn = document.getElementById('save-templates-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status"></span> 儲存中…';
  });
</script>
{% endblock %}
