{% extends "base.html" %}

{% block title %}設定新密碼 | CityLove{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="col-md-6 col-lg-5 col-xl-4">

            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-5">

                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock-fill text-primary fs-1"></i>
                        <h2 class="fw-bold mt-2">設定新密碼</h2>
                        <p class="text-muted">請輸入您的新密碼</p>
                    </div>

                    {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}

                    <form method="POST" action="{{ url_for('auth_bp.reset_password', token=token) }}">

                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="new_password" name="new_password"
                                placeholder="New password" minlength="6" required>
                            <label for="new_password">新密碼（至少 6 個字元）</label>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                                placeholder="Confirm password" minlength="6" required>
                            <label for="confirm_password">確認新密碼</label>
                        </div>

                        <button class="btn btn-danger w-100 py-2 fw-bold rounded-3" type="submit">
                            重設密碼
                        </button>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
