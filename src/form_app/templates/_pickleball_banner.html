{# Seasonal campaign banner: 城遇匹克球季 #}
<div class="mb-4" id="pickleballBannerWrapper">
  <div class="card border-0 rounded-4 shadow-sm text-white position-relative overflow-hidden"
       style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
    <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3"
            aria-label="Close" onclick="dismissPickleballBanner()"></button>
    <div class="card-body p-4 pe-5">
      <div class="d-flex align-items-start gap-3">
        <div class="fs-2">🏓</div>
        <div>
          <h6 class="fw-bold mb-1">Hi, 歡迎來到城遇匹克球季</h6>
          <p class="mb-2 small" style="opacity:.9;">本次任務內容如下：</p>
          <a href="https://join.citylove.tw/pickleball_instructions" target="_blank"
             class="btn btn-light btn-sm fw-bold rounded-pill px-3 mb-2">
            查看任務內容 <i class="bi bi-box-arrow-up-right ms-1"></i>
          </a>
          <p class="mb-0 small" style="opacity:.9;">一起約打球吧～</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var KEY = 'citylove_pickleball_banner_dismissed';
  var wrapper = document.getElementById('pickleballBannerWrapper');
  if (!wrapper) return;
  if (localStorage.getItem(KEY) === '1') {
    wrapper.style.display = 'none';
  }
  window.dismissPickleballBanner = function () {
    localStorage.setItem(KEY, '1');
    wrapper.style.display = 'none';
  };
})();
</script>
