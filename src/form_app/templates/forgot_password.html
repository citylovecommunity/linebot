{% extends "base.html" %}

{% block title %}忘記密碼 | CityLove{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="col-md-6 col-lg-5 col-xl-4">

            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-5">

                    <div class="text-center mb-4">
                        <i class="bi bi-key-fill text-primary fs-1"></i>
                        <h2 class="fw-bold mt-2">忘記密碼</h2>
                        <p class="text-muted">請輸入您的電話號碼，我們會透過 LINE 傳送重設密碼的連結給您。</p>
                    </div>

                    <form method="POST" action="{{ url_for('auth_bp.forgot_password') }}">

                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="phone" name="phone" placeholder="0912345678"
                                required>
                            <label for="phone">您的電話號碼</label>
                        </div>

                        <button class="btn btn-danger w-100 py-2 fw-bold rounded-3" type="submit">
                            傳送重設連結
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="{{ url_for('auth_bp.login') }}" class="text-decoration-none small">返回登入</a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
